services:
  db:
    image: mysql:latest
    container_name: mysqlDB
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PWD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PWD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: ./EmpApp
    image: empapp:latest
    container_name: myApp
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - mynetwork

volumes:
  dbdata:

networks:
  mynetwork:
